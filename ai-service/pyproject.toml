[project]
name = "dataeasy-ai-service"
version = "0.1.0"
description = "dataeasy 인사이트 / 가이드 자동 발행 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "resend>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "markdown>=3.5.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.0",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
